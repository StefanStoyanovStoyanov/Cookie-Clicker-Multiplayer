<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cookie Clicker Multiplayer</title>
        <style>
            body {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
                background-color: #f0f0f0;
                font-family: Arial, sans-serif;
                -webkit-user-select: none;
                user-select: none;
            }
            #cookie {
                cursor: default;
                transition: transform 0.14s ease-out;
                width: 300px;
                height: 300px;
                -webkit-user-drag: none;
            }
            #cookie.is-colored-pixel {
                cursor: pointer;
                transform: scale(1.08);
            }
            #cookie.is-colored-pixel:active {
                transform: scale(0.95);
            }
            #counter {
                font-size: 2em;
                margin: 20px 0;
            }
        </style>
    </head>
    <body>
        <div id="counter">Total Clicks: 0</div>
        <img src="cookie.png" id="cookie" alt="Cookie" draggable="false" />

        <script>
            const protocol = location.protocol === "https:" ? "wss:" : "ws:";
            const cookie = document.getElementById("cookie");
            const counter = document.getElementById("counter");
            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d", { willReadFrequently: true });
            let cookiePixels = null;
            let socket;
            let reconnectDelay = 1000;
            let reconnectTimer;

            function readCookiePixels() {
                if (!context) {
                    throw new Error("Unable to inspect cookie image pixels");
                }

                canvas.width = cookie.naturalWidth;
                canvas.height = cookie.naturalHeight;
                context.drawImage(cookie, 0, 0);
                cookiePixels = context.getImageData(0, 0, canvas.width, canvas.height).data;
            }

            function isColoredPixel(event) {
                if (!cookiePixels) {
                    return false;
                }

                const bounds = cookie.getBoundingClientRect();
                const x = Math.floor(((event.clientX - bounds.left) / bounds.width) * canvas.width);
                const y = Math.floor(((event.clientY - bounds.top) / bounds.height) * canvas.height);
                if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) {
                    return false;
                }

                const pixel = (y * canvas.width + x) * 4;
                return (
                    cookiePixels[pixel + 3] >= 128 &&
                    (cookiePixels[pixel] < 245 || cookiePixels[pixel + 1] < 245 || cookiePixels[pixel + 2] < 245)
                );
            }

            cookie.addEventListener("load", readCookiePixels);
            if (cookie.complete && cookie.naturalWidth > 0) {
                readCookiePixels();
            }

            cookie.addEventListener("mousemove", (event) => {
                cookie.classList.toggle("is-colored-pixel", isColoredPixel(event));
            });
            cookie.addEventListener("mouseleave", () => {
                cookie.classList.remove("is-colored-pixel");
            });
            cookie.addEventListener("pointerdown", (event) => {
                if (!isColoredPixel(event)) {
                    return;
                }

                if (socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ event: "cookieClick" }));
                }
            });

            function connect() {
                socket = new WebSocket(`${protocol}//${location.host}/ws`);

                socket.addEventListener("open", () => {
                    reconnectDelay = 1000;
                });

                socket.addEventListener("message", (message) => {
                    const data = JSON.parse(message.data);
                    if (data.event === "updateCount") {
                        counter.textContent = `Total Clicks: ${data.count}`;
                    }
                });

                socket.addEventListener("close", () => {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = setTimeout(connect, reconnectDelay);
                    reconnectDelay = Math.min(reconnectDelay * 2, 30000);
                });

                socket.addEventListener("error", () => {
                    socket.close();
                });
            }

            connect();
        </script>
    </body>
</html>
