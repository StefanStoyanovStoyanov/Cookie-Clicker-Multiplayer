[package]
name = "cookie-clicker-multiplayer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cookie-clicker-multiplayer"
path = "src/server.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "sync"] }
tower-http = { version = "0.6", features = ["fs"] }
